name: Build and Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify embedded VIIPER dependency
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-viiper.ps1

      - name: Test VIIPER verification script
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/verify-viiper.tests.ps1

      - name: Test VIIPER artifact update tooling
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/update-viiper.tests.ps1

      - name: Test VIIPER dependency adoption tooling
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/adopt-viiper.tests.ps1

      - name: Test VIIPER dependency-update receiver idempotency classifier
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/viiper-existing-automation-check.tests.ps1

      - name: Test VIIPER dependency-update receiver stale-base classifier
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/viiper-base-drift-check.tests.ps1

      - name: Restore
        run: dotnet restore SteamInputAddonforClaw.slnx

      - name: Build
        run: dotnet build SteamInputAddonforClaw.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $testProjects = @()
          if (Test-Path tests) {
            $testProjects = @(Get-ChildItem -Path tests -Filter *.csproj -Recurse -File)
          }

          if ($testProjects.Count -eq 0) {
            Write-Host 'No test projects found. Skipping tests.'
            exit 0
          }

          foreach ($testProject in $testProjects) {
            dotnet test $testProject.FullName -c Release --no-build --no-restore `
              --blame-hang-timeout 3m --blame-hang-dump-type full `
              --blame-crash --blame-crash-dump-type mini `
              --results-directory artifacts/TestResults
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload test hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-hang-diagnostics
          path: artifacts/TestResults
          if-no-files-found: ignore
          retention-days: 1

      - name: Test release metadata
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/release-metadata.tests.ps1

      - name: Test publish asset verifier regressions
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/verify-publish-assets.tests.ps1

      - name: Test publish size report
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/report-publish-size.tests.ps1

      - name: Publish Runtime and external UI layout
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File scripts/publish-layout.ps1
          -Version 0.1.0
          -Configuration Release
          -PublishDirectory artifacts/publish
          -NoRestore

      - name: Build and verify CI FSE package
        shell: pwsh
        run: |
          Write-Host 'Creating ephemeral CI FSE signing certificate.'
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=SteamInputAddonforClaw' `
            -CertStoreLocation Cert:\CurrentUser\My
          $certificatePassword = ConvertTo-SecureString 'ci-only-fse-package-test' -AsPlainText -Force
          $pfxPath = Join-Path $env:RUNNER_TEMP 'SteamInputAddonforClaw-FseHome-ci.pfx'
          $cerPath = Join-Path $env:RUNNER_TEMP 'SteamInputAddonforClaw-FseHome-ci.cer'
          try {
            Write-Host 'Exporting ephemeral CI FSE signing certificate.'
            Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $certificatePassword | Out-Null
            Export-Certificate -Cert $certificate -FilePath $cerPath | Out-Null

            # Do not import a disposable self-signed certificate into CurrentUser\Root.
            # Windows can show a trust confirmation for root installation, which has no
            # interactive answer on a GitHub-hosted runner and stalls the entire job.
            # TrustedPeople is sufficient for Authenticode verification of this exact
            # ephemeral signer without changing the runner's root trust anchors.
            Write-Host 'Trusting the ephemeral CI FSE signer in CurrentUser TrustedPeople.'
            Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\CurrentUser\TrustedPeople | Out-Null

            Write-Host 'Creating and signing the CI FSE MSIX package.'
            & ./scripts/package-fse-home.ps1 `
              -PublishDirectory artifacts/publish `
              -OutputPath artifacts/publish/fse/SteamInputAddonforClaw.FseHome.msix `
              -CertificatePath $pfxPath `
              -CertificatePassword $certificatePassword `
              -ExpectedVersion 0.1.0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Write-Host 'Verifying the signed CI FSE MSIX package.'
            & ./scripts/verify-publish-assets.ps1 `
              -PublishDirectory artifacts/publish `
              -RequireFsePackage `
              -ExpectedFsePackageVersion 0.1.0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Remove-Item -LiteralPath $pfxPath, $cerPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "Cert:\CurrentUser\TrustedPeople\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
          }

      - name: Verify published Runtime assets
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File scripts/verify-publish-assets.ps1
          -PublishDirectory artifacts/publish

      - name: Report publish size
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File scripts/report-publish-size.ps1
          -PublishDirectory artifacts/publish

      - name: Startup process smoke test
        shell: pwsh
        run: |
          $executable = Join-Path $PWD 'artifacts\publish\SteamInputAddonforClaw.exe'
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Published executable was not found: $executable"
          }

          $process = Start-Process -FilePath $executable -ArgumentList '--background' -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "Published executable exited during startup smoke test with code $($process.ExitCode)."
            }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }
