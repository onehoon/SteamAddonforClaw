name: Build and Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify embedded VIIPER dependency
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-viiper.ps1

      - name: Test VIIPER verification script
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/verify-viiper.tests.ps1

      - name: Test VIIPER artifact update tooling
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/update-viiper.tests.ps1

      - name: Test VIIPER dependency adoption tooling
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/adopt-viiper.tests.ps1

      - name: Test VIIPER dependency-update receiver idempotency classifier
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/viiper-existing-automation-check.tests.ps1

      - name: Restore
        run: dotnet restore SteamInputAddonforClaw.slnx

      - name: Build
        run: dotnet build SteamInputAddonforClaw.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $testProjects = @()
          if (Test-Path tests) {
            $testProjects = @(Get-ChildItem -Path tests -Filter *.csproj -Recurse -File)
          }

          if ($testProjects.Count -eq 0) {
            Write-Host 'No test projects found. Skipping tests.'
            exit 0
          }

          foreach ($testProject in $testProjects) {
            dotnet test $testProject.FullName -c Release --no-restore `
              --blame-hang-timeout 3m --blame-hang-dump-type full `
              --results-directory artifacts/TestResults
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload test hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-hang-diagnostics
          path: artifacts/TestResults
          if-no-files-found: ignore
          retention-days: 7

      - name: Test release metadata
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/release-metadata.tests.ps1

      - name: Publish smoke test
        run: >-
          dotnet publish src/SteamInputAddonforClaw/SteamInputAddonforClaw.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -o artifacts/publish

      - name: Verify published WinUI assets
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File scripts/verify-publish-assets.ps1
          -PublishDirectory artifacts/publish

      - name: Startup process smoke test
        shell: pwsh
        run: |
          $executable = Join-Path $PWD 'artifacts\publish\SteamInputAddonforClaw.exe'
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Published executable was not found: $executable"
          }

          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "Published executable exited during startup smoke test with code $($process.ExitCode)."
            }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }
