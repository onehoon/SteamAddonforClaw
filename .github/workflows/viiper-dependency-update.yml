name: VIIPER Dependency Update

# Automatically (or manually) fetches, independently re-verifies, and
# mechanically adopts a canonical VIIPER artifact into a Draft PR. It never
# infers ABI compatibility, edits managed P/Invoke code, or merges anything.
#
# Trust model: the event payload's commit SHA is only an input, never
# authority. scripts/update-viiper.ps1 independently rediscovers and
# verifies the exact commit's canonical push/main/success artifact and its
# manifest before scripts/adopt-viiper.ps1 touches anything.

on:
  repository_dispatch:
    types: [viiper-canonical-ready]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Exact 40-character VIIPER commit SHA to adopt'
        required: true

permissions:
  contents: read

concurrency:
  group: viiper-dependency-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Resolve target commit
        id: target
        shell: pwsh
        env:
          DISPATCH_COMMIT: ${{ github.event.client_payload.commit }}
          DISPATCH_SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          MANUAL_COMMIT: ${{ github.event.inputs.commit }}
        run: |
          $commit = if ($env:MANUAL_COMMIT) { $env:MANUAL_COMMIT } else { $env:DISPATCH_COMMIT }
          if ([string]::IsNullOrWhiteSpace($commit)) {
            throw 'No target commit was provided by either repository_dispatch.client_payload.commit or workflow_dispatch.inputs.commit.'
          }
          if ($commit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Target commit must be exactly 40 hexadecimal characters. Branch names, tags, and short SHAs are not accepted. Got: '$commit'."
          }
          $commit = $commit.ToLowerInvariant()
          Write-Host "Target commit: $commit"
          if ($env:DISPATCH_SOURCE_RUN_ID) {
            Write-Host "Dispatch-reported source run (diagnostic only, not trusted as artifact authority): $env:DISPATCH_SOURCE_RUN_ID"
          }
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.VIIPER_ADDON_BOT_APP_ID }}
          private-key: ${{ secrets.VIIPER_ADDON_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            SteamInputAddonforClaw
            VIIPER

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check current pin and classify upgrade eligibility
        id: eligibility
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          $lock = Get-Content -LiteralPath 'src/SteamInputAddonforClaw/Dependencies/Viiper/viiper.lock.json' -Raw | ConvertFrom-Json
          $currentCommit = $lock.commit

          # Reuse adopt-viiper.ps1's pure eligibility classifier rather than duplicating the logic.
          . ./scripts/adopt-viiper.ps1 -StagingDirectory 'unused-for-dot-source'

          if ($env:TARGET_COMMIT -eq $currentCommit) {
            $status = 'identical'
          } else {
            $compare = gh api "repos/onehoon/VIIPER/compare/$currentCommit...$($env:TARGET_COMMIT)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to compare $currentCommit...$($env:TARGET_COMMIT) on onehoon/VIIPER via GitHub API."
            }
            $status = $compare.status
          }

          $eligibility = Test-ViiperUpgradeEligibility -CurrentCommit $currentCommit -TargetCommit $env:TARGET_COMMIT -CompareStatus $status
          Write-Host "Current commit: $currentCommit"
          Write-Host "Target commit:  $($env:TARGET_COMMIT)"
          Write-Host "Compare status: $status"
          Write-Host "Eligibility:    $eligibility"

          if ($eligibility -eq 'Downgrade') {
            Write-Host "Target commit is behind the current embedded revision. Not creating a downgrade PR; treating as a clean no-op."
            $eligibility = 'NoOp'
          }
          if ($eligibility -eq 'FailClosed') {
            throw "Cannot establish that $($env:TARGET_COMMIT) is a forward revision of $currentCommit on onehoon/VIIPER main (compare status: '$status'). Failing closed rather than guessing."
          }

          "eligibility=$eligibility" >> $env:GITHUB_OUTPUT
          "current_commit=$currentCommit" >> $env:GITHUB_OUTPUT

      - name: Check for an existing automation branch/PR
        id: existing
        if: steps.eligibility.outputs.eligibility == 'Eligible'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          $branch = "automation/viiper-$($env:TARGET_COMMIT)"
          $existingPrs = gh pr list --head $branch --state all --json number,isDraft,state | ConvertFrom-Json
          if ($existingPrs.Count -gt 0) {
            $pr = $existingPrs[0]
            Write-Host "An automation PR for $($env:TARGET_COMMIT) already exists: #$($pr.number) (state=$($pr.state), draft=$($pr.isDraft)). Not creating a duplicate or force-pushing over it."
            "branch=$branch" >> $env:GITHUB_OUTPUT
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "branch=$branch" >> $env:GITHUB_OUTPUT
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Fetch and verify canonical artifact
        if: steps.eligibility.outputs.eligibility == 'Eligible' && steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/update-viiper.ps1 -Commit $env:TARGET_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mechanically adopt the verified artifact
        if: steps.eligibility.outputs.eligibility == 'Eligible' && steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          TARGET_COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          $staging = "artifacts/viiper-update/$($env:TARGET_COMMIT)"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/adopt-viiper.ps1 -StagingDirectory $staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify adopted dependency identity
        if: steps.eligibility.outputs.eligibility == 'Eligible' && steps.existing.outputs.exists == 'false'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-viiper.ps1

      - name: Run dependency verification-script tests
        if: steps.eligibility.outputs.eligibility == 'Eligible' && steps.existing.outputs.exists == 'false'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/verify-viiper.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/update-viiper.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/adopt-viiper.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        if: steps.eligibility.outputs.eligibility == 'Eligible' && steps.existing.outputs.exists == 'false'
        run: dotnet restore SteamInputAddonforClaw.slnx

      - name: Build
        if: steps.eligibility.outputs.eligibility == 'Eligible' && steps.existing.outputs.exists == 'false'
        run: dotnet build SteamInputAddonforClaw.slnx -c Release --no-restore

      - name: Test
        if: steps.eligibility.outputs.eligibility == 'Eligible' && steps.existing.outputs.exists == 'false'
        shell: pwsh
        run: |
          $testProjects = @(Get-ChildItem -Path tests -Filter *.csproj -Recurse -File)
          foreach ($testProject in $testProjects) {
            dotnet test $testProject.FullName -c Release --no-restore --blame-hang-timeout 3m --blame-hang-dump-type full
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: git diff --check
        if: steps.eligibility.outputs.eligibility == 'Eligible' && steps.existing.outputs.exists == 'false'
        run: git diff --check

      - name: Commit, push, and open Draft PR
        if: steps.eligibility.outputs.eligibility == 'Eligible' && steps.existing.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_COMMIT: ${{ steps.target.outputs.commit }}
          CURRENT_COMMIT: ${{ steps.eligibility.outputs.current_commit }}
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          git config user.name 'viiper-addon-dependency-bot[bot]'
          git config user.email 'viiper-addon-dependency-bot[bot]@users.noreply.github.com'

          git checkout -b $env:BRANCH
          git add -A
          git commit -m "VIIPER dependency update: $($env:CURRENT_COMMIT.Substring(0,7)) -> $($env:TARGET_COMMIT.Substring(0,7))" -m "Mechanically adopted by the VIIPER Dependency Update workflow. Managed ABI compatibility has NOT been inferred or automatically adapted -- review required before merge."
          git push -u origin $env:BRANCH

          $shortSha = $env:TARGET_COMMIT.Substring(0, 7)
          $title = "VIIPER dependency update: $shortSha"
          $backtick = [char]0x60
          $codeSpan = { param($text) "$backtick$text$backtick" }
          $bodyLines = @(
            '## Automated VIIPER dependency update',
            '',
            "- Previous embedded commit: $(& $codeSpan $env:CURRENT_COMMIT)",
            "- Requested exact target commit: $(& $codeSpan $env:TARGET_COMMIT)",
            "- Independently re-verified via $(& $codeSpan 'scripts/update-viiper.ps1') against the exact canonical push/main/success artifact for this commit (see the 'Fetch and verify canonical artifact' step log for the discovered run/artifact/hash details).",
            "- Mechanically adopted via $(& $codeSpan 'scripts/adopt-viiper.ps1'): vendored DLL/header, $(& $codeSpan 'viiper.lock.json'), $(& $codeSpan 'PROVENANCE.md') identity fields, documented pins, $(& $codeSpan 'THIRD_PARTY_NOTICES.md') source identity, the runtime prerequisite hash, and the publish-gate hash.",
            '',
            '## Managed ABI compatibility has NOT been inferred or automatically adapted',
            '',
            "This automation never edits managed P/Invoke code, $(& $codeSpan 'RequiredExports'), struct/enum layouts, callback lifetime logic, or any runtime/session/mapper behavior. Review the generated $(& $codeSpan 'libVIIPER.h') diff and the managed interop before merging.",
            '',
            "- [ ] Generated $(& $codeSpan 'libVIIPER.h') diff reviewed",
            "- [ ] Managed P/Invoke / $(& $codeSpan 'RequiredExports') compatibility reviewed",
            '- [ ] Callback/lifecycle contract reviewed if affected',
            '- [ ] Addon changes added to this PR if required',
            "- [ ] $(& $codeSpan 'scripts/verify-viiper.ps1') passes",
            '- [ ] Release build passes',
            '- [ ] Full tests pass',
            '- [ ] GitHub Actions green',
            '- [ ] Hardware claims unchanged unless separately validated',
            '',
            'Do not merge until every item above is checked. This PR does not auto-merge.'
          )
          $body = $bodyLines -join "`n"

          gh pr create --draft --title $title --body $body --head $env:BRANCH --base main
