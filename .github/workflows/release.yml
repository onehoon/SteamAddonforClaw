name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Verify main branch
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Release can only run from main.'
          }

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify embedded VIIPER dependency
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-viiper.ps1

      - name: Test VIIPER verification script
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/verify-viiper.tests.ps1

      - name: Restore
        run: dotnet restore SteamInputAddonforClaw.slnx

      - name: Build
        run: dotnet build SteamInputAddonforClaw.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $testProjects = @(Get-ChildItem -Path tests -Filter *.csproj -Recurse -File)
          foreach ($testProject in $testProjects) {
            dotnet test $testProject.FullName -c Release --no-restore `
              --blame-hang-timeout 3m --blame-hang-dump-type full `
              --results-directory artifacts/TestResults
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload test hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-hang-diagnostics
          path: artifacts/TestResults
          if-no-files-found: ignore
          retention-days: 7

      - name: Test release metadata
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/release-metadata.tests.ps1

      - name: Test release pruning
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/prune-releases.tests.ps1

      - name: Calculate release metadata
        id: metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to enumerate GitHub releases."
          }

          $releases = @($releaseJson | ConvertFrom-Json)
          $publishedTags = @(
            $releases |
              Where-Object { -not $_.isDraft -and -not $_.isPrerelease } |
              ForEach-Object tagName
          )
          & ./scripts/release-metadata.ps1 -PublishedReleaseTags $publishedTags -OutputFile $env:GITHUB_OUTPUT

      - name: Verify release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.TAG }}
        run: |
          $existingTag = git tag --list $env:TAG
          if ($existingTag) {
            throw "Tag $env:TAG already exists."
          }

          gh release view $env:TAG *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            throw "Release $env:TAG already exists."
          }

          $global:LASTEXITCODE = 0

      - name: Generate release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.metadata.outputs.PREVIOUS_TAG }}
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/release-notes.ps1
          -PreviousTag "$env:PREVIOUS_TAG"
          -CurrentSha "${{ github.sha }}"
          -OutputFile artifacts/release-notes.md

      - name: Download previous Velopack release
        if: steps.metadata.outputs.PREVIOUS_TAG != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dnx vpk --version 1.2.0 download github
          --repoUrl https://github.com/${{ github.repository }}
          --token $env:GITHUB_TOKEN
          --outputDir artifacts/Releases

      - name: Package release
        env:
          VERSION: ${{ steps.metadata.outputs.VERSION }}
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/pack.ps1
          -Version $env:VERSION
          -PreserveReleases
          -ReleaseNotesPath artifacts/release-notes.md

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.VERSION }}
          TAG: ${{ steps.metadata.outputs.TAG }}
        run: >-
          dnx vpk --version 1.2.0 upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token $env:GITHUB_TOKEN
          --outputDir artifacts/Releases
          --publish
          --releaseName $env:TAG
          --tag $env:TAG
          --targetCommitish ${{ github.sha }}

      - name: Apply release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.TAG }}
        run: gh release edit $env:TAG --title $env:TAG --notes-file artifacts/release-notes.md

      - name: Prune oldest published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/prune-releases.ps1
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $releaseToPrune = Get-ReleaseToPrune -Releases $releases
          if ($null -eq $releaseToPrune) {
            Write-Host 'No release pruning is required.'
            exit 0
          }

          Write-Host "Deleting oldest published release and tag: $($releaseToPrune.tag_name)"
          gh release delete $releaseToPrune.tag_name --yes --cleanup-tag
