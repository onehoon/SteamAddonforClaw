name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - stable
          - pre
        default: stable

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CHANNEL: ${{ inputs.channel || 'stable' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify embedded VIIPER dependency
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-viiper.ps1

      - name: Test VIIPER verification script
        if: ${{ inputs.channel != 'pre' }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/verify-viiper.tests.ps1

      - name: Restore solution and test dependencies
        if: ${{ inputs.channel != 'pre' }}
        run: dotnet restore SteamInputAddonforClaw.slnx

      - name: Restore UI and Overlay tests
        if: ${{ inputs.channel != 'pre' }}
        run: dotnet restore tests/SteamInputAddonforClaw.UiTests/SteamInputAddonforClaw.UiTests.csproj

      - name: Build solution and test projects
        if: ${{ inputs.channel != 'pre' }}
        run: dotnet build SteamInputAddonforClaw.slnx -c Release --no-restore

      - name: Build UI and Overlay tests
        if: ${{ inputs.channel != 'pre' }}
        run: dotnet build tests/SteamInputAddonforClaw.UiTests/SteamInputAddonforClaw.UiTests.csproj -c Release --no-restore

      - name: Restore production projects
        if: ${{ inputs.channel == 'pre' }}
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path src -Filter *.csproj -Recurse -File | Sort-Object FullName)
          foreach ($project in $projects) {
            dotnet restore $project.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Restore failed for production project $($project.Name)."
            }
          }

      - name: Build production projects
        if: ${{ inputs.channel == 'pre' }}
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path src -Filter *.csproj -Recurse -File | Sort-Object FullName)
          foreach ($project in $projects) {
            dotnet build $project.FullName -c Release --no-restore
            if ($LASTEXITCODE -ne 0) {
              throw "Build failed for production project $($project.Name)."
            }
          }

      - name: Test
        if: ${{ inputs.channel != 'pre' }}
        shell: pwsh
        run: |
          $testProjects = @(Get-ChildItem -Path tests -Filter *.csproj -Recurse -File)
          foreach ($testProject in $testProjects) {
            dotnet test $testProject.FullName -c Release --no-build --no-restore `
              --blame-hang-timeout 3m --blame-hang-dump-type full `
              --results-directory artifacts/TestResults
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload test hang diagnostics
        if: ${{ failure() && inputs.channel != 'pre' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-hang-diagnostics
          path: artifacts/TestResults
          if-no-files-found: ignore
          retention-days: 1

      - name: Test release metadata
        if: ${{ inputs.channel != 'pre' }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/release-metadata.tests.ps1

      - name: Test release pruning
        if: ${{ inputs.channel != 'pre' }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/prune-releases.tests.ps1

      - name: Calculate release metadata
        id: metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to enumerate GitHub releases.'
          }

          $publishedTags = @(
            @($releaseJson | ConvertFrom-Json) |
              Where-Object { -not $_.isDraft } |
              ForEach-Object tagName
          )
          & ./scripts/release-metadata.ps1 -PublishedReleaseTags $publishedTags -Channel $env:CHANNEL -OutputFile $env:GITHUB_OUTPUT | Out-Null

      - name: Verify release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.TAG }}
        run: |
          $existingTag = git tag --list $env:TAG
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to enumerate local Git tags.'
          }
          if ($existingTag) {
            throw "Tag $env:TAG already exists."
          }

          gh release view $env:TAG *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            throw "Release $env:TAG already exists."
          }

          $global:LASTEXITCODE = 0

      - name: Generate release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.metadata.outputs.PREVIOUS_TAG }}
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/release-notes.ps1
          -PreviousTag "$env:PREVIOUS_TAG"
          -CurrentSha "${{ github.sha }}"
          -OutputFile artifacts/release-notes.md

      - name: Download previous channel package
        if: steps.metadata.outputs.PREVIOUS_TAG != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.metadata.outputs.PREVIOUS_TAG }}
          VELOPACK_CHANNEL: ${{ steps.metadata.outputs.VELOPACK_CHANNEL }}
        run: |
          $arguments = @(
            'vpk', '--version', '1.2.158', 'download', 'github',
            '--repoUrl', "https://github.com/$env:GITHUB_REPOSITORY",
            '--token', $env:GITHUB_TOKEN,
            '--outputDir', 'artifacts/Releases',
            '--channel', $env:VELOPACK_CHANNEL
          )
          if ($env:CHANNEL -eq 'pre') {
            $arguments += '--pre'
          }

          dnx @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to download the previous channel package.'
          }

          $previousVersion = $env:PREVIOUS_TAG.Substring(1)
          $channelSuffix = if ($env:VELOPACK_CHANNEL -eq 'win') { '' } else { "-$env:VELOPACK_CHANNEL" }
          $previousFullPackage = Join-Path 'artifacts/Releases' "SteamInputAddonforClaw-$previousVersion$channelSuffix-full.nupkg"
          if (-not (Test-Path -LiteralPath $previousFullPackage -PathType Leaf)) {
            throw "The downloaded package does not match previous channel tag $env:PREVIOUS_TAG."
          }

      - name: Package release
        shell: pwsh
        env:
          VERSION: ${{ steps.metadata.outputs.VERSION }}
          VELOPACK_CHANNEL: ${{ steps.metadata.outputs.VELOPACK_CHANNEL }}
        run: |
          & ./scripts/pack.ps1 `
            -Version $env:VERSION `
            -Channel $env:VELOPACK_CHANNEL `
            -PreserveReleases `
            -ReleaseNotesPath artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify channel packages and feed
        shell: pwsh
        env:
          VERSION: ${{ steps.metadata.outputs.VERSION }}
          PREVIOUS_TAG: ${{ steps.metadata.outputs.PREVIOUS_TAG }}
          VELOPACK_CHANNEL: ${{ steps.metadata.outputs.VELOPACK_CHANNEL }}
        run: |
          $releasesDirectory = 'artifacts/Releases'
          $channelSuffix = if ($env:VELOPACK_CHANNEL -eq 'win') { '' } else { "-$env:VELOPACK_CHANNEL" }
          $fullPackage = Join-Path $releasesDirectory "SteamInputAddonforClaw-$env:VERSION$channelSuffix-full.nupkg"
          $deltaPackage = Join-Path $releasesDirectory "SteamInputAddonforClaw-$env:VERSION$channelSuffix-delta.nupkg"
          $feed = Join-Path $releasesDirectory "releases.$env:VELOPACK_CHANNEL.json"

          if (-not (Test-Path -LiteralPath $fullPackage -PathType Leaf)) {
            throw "Full package was not produced for $env:VERSION."
          }
          if (-not (Test-Path -LiteralPath $feed -PathType Leaf)) {
            throw "Channel feed $feed was not produced."
          }
          if (-not (Get-Content -LiteralPath $feed -Raw).Contains($env:VERSION)) {
            throw "Channel feed $feed does not list $env:VERSION."
          }

          if ($env:PREVIOUS_TAG) {
            if (-not (Test-Path -LiteralPath $deltaPackage -PathType Leaf)) {
              throw "Delta package was not produced from the previous $env:CHANNEL release."
            }
          }
          elseif (Test-Path -LiteralPath $deltaPackage) {
            throw 'A Delta package was produced without a prior release in this channel.'
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.VERSION }}
          TAG: ${{ steps.metadata.outputs.TAG }}
          VELOPACK_CHANNEL: ${{ steps.metadata.outputs.VELOPACK_CHANNEL }}
        run: |
          $arguments = @(
            'vpk', '--version', '1.2.158', 'upload', 'github',
            '--repoUrl', "https://github.com/$env:GITHUB_REPOSITORY",
            '--token', $env:GITHUB_TOKEN,
            '--outputDir', 'artifacts/Releases',
            '--channel', $env:VELOPACK_CHANNEL,
            '--publish',
            '--releaseName', $env:TAG,
            '--tag', $env:TAG,
            '--targetCommitish', '${{ github.sha }}'
          )
          if ($env:CHANNEL -eq 'pre') {
            $arguments += '--pre'
          }

          dnx @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish GitHub release $env:TAG."
          }

      - name: Apply release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.TAG }}
        run: gh release edit $env:TAG --title $env:TAG --notes-file artifacts/release-notes.md

      - name: Prune releases and tags
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/prune-releases.ps1
          $releaseJson = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to enumerate GitHub releases for pruning.'
          }

          $releasePages = $releaseJson | ConvertFrom-Json
          $releases = @($releasePages | ForEach-Object { $_ })
          $releasesToPrune = @(Get-ReleasesToPrune -Releases $releases -StableRetainCount 5 -PreReleaseRetainCount 1)
          foreach ($release in $releasesToPrune) {
            Write-Host "Deleting published release and tag: $($release.tag_name)"
            gh release delete $release.tag_name --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to delete release $($release.tag_name)."
            }
          }

          if ($releasesToPrune.Count -eq 0) {
            Write-Host 'No release pruning is required.'
          }
